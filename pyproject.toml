[project]
name = "cv-builder"
version = "0.1.0"
description = "Local-first AI career copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
  "python-multipart",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "openai",
  "pypdf",
  "python-docx",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

