[project]
name = "cv-builder"
version = "0.1.0"
description = "Local-first AI career copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
  "python-multipart",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "openai",
  "playwright",
  "pypdf",
  "python-docx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["workspace*", "tests*"]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
