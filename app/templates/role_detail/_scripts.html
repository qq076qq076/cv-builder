  <script>
    document.querySelectorAll("[data-add-repeatable]").forEach((button) => {
      button.addEventListener("click", () => {
        const key = button.dataset.addRepeatable;
        const form = button.closest("form");
        const template = form.querySelector(`[data-repeatable-template="${key}"]`);
        const list = form.querySelector(`[data-repeatable-list="${key}"]`);
        if (!template || !list) return;
        list.append(template.content.firstElementChild.cloneNode(true));
      });
    });

    const languageDialog = document.querySelector("[data-language-dialog]");
    let activeLanguageForm = null;

    const setupLanguagePopup = (form) => {
      const languageInput = form.querySelector("[data-target-language-input]");
      if (!languageDialog || !languageInput) return;

      form.addEventListener("submit", (event) => {
        if (form.dataset.languageConfirmed === "true") {
          return;
        }
        event.preventDefault();
        event.stopImmediatePropagation();
        activeLanguageForm = form;
        if (typeof languageDialog.showModal === "function") {
          languageDialog.showModal();
        } else {
          languageInput.value = window.confirm("使用英文解析？") ? "en" : "zh";
          form.dataset.languageConfirmed = "true";
          form.requestSubmit();
        }
      });
    };

    if (languageDialog) {
      languageDialog.querySelectorAll("[data-language-choice]").forEach((button) => {
        button.addEventListener("click", () => {
          if (!activeLanguageForm) return;
          const languageInput = activeLanguageForm.querySelector("[data-target-language-input]");
          if (!languageInput) return;
          languageInput.value = button.dataset.languageChoice || "zh";
          activeLanguageForm.dataset.languageConfirmed = "true";
          languageDialog.close();
          activeLanguageForm.requestSubmit();
          activeLanguageForm = null;
        });
      });

      languageDialog.querySelector("[data-language-cancel]")?.addEventListener("click", () => {
        activeLanguageForm = null;
        languageDialog.close();
      });
    }

    document.querySelectorAll("[data-language-popup]").forEach(setupLanguagePopup);

    const roleTabs = document.querySelector("[data-role-tabs]");
    if (roleTabs) {
      const tabTriggers = Array.from(roleTabs.querySelectorAll("[data-tab-trigger]"));
      const tabPanels = Array.from(roleTabs.querySelectorAll("[data-tab-panel]"));
      const tabForHash = (hash) => {
        if (hash === "jobs") return "jobs";
        if (hash === "evidence") return "evidence";
        return "resume";
      };
      const selectRoleTab = (tabKey) => {
        tabTriggers.forEach((trigger) => {
          const isActive = trigger.dataset.tabTrigger === tabKey;
          trigger.classList.toggle("is-active", isActive);
          trigger.setAttribute("aria-selected", isActive ? "true" : "false");
        });
        tabPanels.forEach((panel) => {
          const isActive = panel.dataset.tabPanel === tabKey;
          panel.classList.toggle("is-active", isActive);
          panel.hidden = !isActive;
        });
      };

      tabTriggers.forEach((trigger) => {
        trigger.addEventListener("click", () => {
          const tabKey = trigger.dataset.tabTrigger || "resume";
          selectRoleTab(tabKey);
          window.history.replaceState(
            null,
            "",
            `${window.location.pathname}${window.location.search}#${tabKey}`,
          );
        });
      });
      window.addEventListener("hashchange", () => selectRoleTab(tabForHash(window.location.hash.slice(1))));
      selectRoleTab(tabForHash(window.location.hash.slice(1)));
    }

    const roleId = "{{ role.id }}";
    const toastList = document.querySelector("[data-generation-toasts]");
    const activeGenerationForms = new Map();
    const clientActiveTaskKeys = new Set();
    const loadNotifiedTaskIds = () => {
      try {
        return JSON.parse(window.sessionStorage.getItem(`generation-notified:${roleId}`) || "[]");
      } catch (_error) {
        return [];
      }
    };
    const notifiedTaskIds = new Set(loadNotifiedTaskIds());
    let generationTasksInitialized = false;

    const saveNotifiedTaskIds = () => {
      window.sessionStorage.setItem(
        `generation-notified:${roleId}`,
        JSON.stringify(Array.from(notifiedTaskIds).slice(-100))
      );
    };

    const taskKey = (jobId, kind) => `${jobId}:${kind}`;
    const generationTaskStorageKey = (jobId, kind) => `generation-pending:${roleId}:${jobId}:${kind}`;
    const setGenerationFormRunning = (form, running) => {
      form.classList.toggle("is-submitting", running);
      form.dataset.generationActive = running ? "true" : "false";
      form.querySelectorAll('button[type="submit"]').forEach((button) => {
        if (running) {
          button.setAttribute("aria-busy", "true");
          const loadingLabel = button.dataset.loadingLabel;
          if (loadingLabel) button.setAttribute("aria-label", loadingLabel);
          button.title = loadingLabel || "點擊取消生成";
        } else {
          button.removeAttribute("aria-busy");
          button.removeAttribute("aria-label");
          button.removeAttribute("title");
        }
      });
    };

    document.querySelectorAll("[data-background-generate]").forEach((form) => {
      const key = taskKey(form.dataset.jobId, form.dataset.generationKind);
      if (!activeGenerationForms.has(key)) {
        activeGenerationForms.set(key, new Set());
      }
      activeGenerationForms.get(key).add(form);
      if (form.classList.contains("is-submitting")) {
        clientActiveTaskKeys.add(key);
        setGenerationFormRunning(form, true);
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (form.dataset.generationActive === "true") {
          await cancelGenerationTask(form, key);
          return;
        }
        setGenerationFormRunning(form, true);
        clientActiveTaskKeys.add(key);
        try {
          const response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: {"X-Requested-With": "fetch"},
          });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          if (form.closest(".app-modal")) {
            const data = await response.json();
            const taskId = data.task?.id;
            if (!taskId) throw new Error("生成任務回應無效");
            window.sessionStorage.setItem(
              generationTaskStorageKey(form.dataset.jobId, form.dataset.generationKind),
              taskId,
            );
            window.location.href = `/roles/${roleId}#jobs`;
            return;
          }
          pollGenerationTasks({force: true});
        } catch (error) {
          clientActiveTaskKeys.delete(key);
          setGenerationFormRunning(form, false);
          addGenerationToast({
            status: "failed",
            label: "生成任務",
            error: `送出失敗：${error.message}`,
          });
        }
      });
    });

    const cancelGenerationTask = async (form, key) => {
      const button = form.querySelector('button[type="submit"]');
      if (button) {
        button.disabled = true;
        button.setAttribute("aria-busy", "true");
      }
      try {
        const response = await fetch(form.dataset.cancelAction, {
          method: "POST",
          body: new FormData(form),
          headers: {"X-Requested-With": "fetch", "Accept": "application/json"},
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        clientActiveTaskKeys.delete(key);
        setGenerationFormRunning(form, false);
        pollGenerationTasks({force: true});
      } catch (error) {
        addGenerationToast({
          status: "failed",
          label: "取消任務",
          error: `取消失敗：${error.message}`,
        });
      } finally {
        if (button) {
          button.disabled = false;
          if (form.dataset.generationActive !== "true") {
            button.removeAttribute("aria-busy");
          }
        }
      }
    };

    const addGenerationToast = (task) => {
      if (!toastList) return;
      const notice = document.createElement("div");
      notice.className = `app-notice generation-toast ${task.status === "failed" || task.status === "cancelled" ? "app-notice-muted" : ""}`;
      const label = task.label || "生成任務";
      if (task.status === "completed") {
        notice.append(`${label}已生成。`);
        const actions = document.createElement("div");
        actions.className = "generation-toast-actions";
        if (task.viewUrl) {
          const viewLink = document.createElement("a");
          viewLink.className = "app-button app-button-secondary generation-toast-action";
          viewLink.href = task.viewUrl;
          viewLink.textContent = `顯示${label}`;
          actions.append(viewLink);
        }
        if (task.pdfUrl) {
          const pdfLink = document.createElement("a");
          pdfLink.className = "app-button app-button-secondary generation-toast-action";
          pdfLink.href = task.pdfUrl;
          pdfLink.textContent = "下載 PDF";
          actions.append(pdfLink);
        }
        if (actions.childElementCount) notice.append(actions);
      } else if (task.status === "cancelled") {
        notice.textContent = `${label}已取消。`;
      } else {
        notice.textContent = `${label}生成失敗：${task.error || "未知錯誤"}`;
      }
      toastList.prepend(notice);
    };

    const applyGenerationTasks = (tasks) => {
      let hasActiveTask = false;
      const latestTasks = new Map();
      tasks.forEach((task) => {
        const key = taskKey(task.jobId, task.kind);
        if (!latestTasks.has(key)) latestTasks.set(key, task);
      });
      latestTasks.forEach((task) => {
        const key = taskKey(task.jobId, task.kind);
        const isActive = task.status === "queued" || task.status === "running";
        const forms = activeGenerationForms.get(key) || new Set();
        if (isActive) {
          hasActiveTask = true;
          clientActiveTaskKeys.add(key);
        } else {
          clientActiveTaskKeys.delete(key);
        }
        forms.forEach((form) => setGenerationFormRunning(form, isActive));
        const pendingTaskId = window.sessionStorage.getItem(
          generationTaskStorageKey(task.jobId, task.kind),
        );
        const shouldNotify = generationTasksInitialized || clientActiveTaskKeys.has(key) || pendingTaskId === task.id;
        if (pendingTaskId === task.id && task.status !== "queued" && task.status !== "running") {
          window.sessionStorage.removeItem(generationTaskStorageKey(task.jobId, task.kind));
        }
        if ((task.status === "completed" || task.status === "failed" || task.status === "cancelled") && shouldNotify && !notifiedTaskIds.has(task.id)) {
          notifiedTaskIds.add(task.id);
          saveNotifiedTaskIds();
          addGenerationToast(task);
        }
      });
      generationTasksInitialized = true;
      clientActiveTaskKeys.forEach((key) => {
        const forms = activeGenerationForms.get(key) || new Set();
        if (forms.size) {
          hasActiveTask = true;
          forms.forEach((form) => setGenerationFormRunning(form, true));
        }
      });
      return hasActiveTask;
    };

    const pollGenerationTasks = async ({force = false} = {}) => {
      if (!activeGenerationForms.size || (!force && !clientActiveTaskKeys.size)) return;
      try {
        const response = await fetch(`/roles/${roleId}/generation-tasks`, {
          headers: {"Accept": "application/json"},
        });
        if (!response.ok) return;
        const data = await response.json();
        const hasActiveTask = applyGenerationTasks(data.tasks || []);
        if (hasActiveTask) {
          window.setTimeout(pollGenerationTasks, 2500);
        }
      } catch (_error) {
        window.setTimeout(pollGenerationTasks, 5000);
      }
    };

    pollGenerationTasks({force: true});

    const coverLetterRegenerationDialog = document.querySelector("[data-cover-letter-regeneration-dialog]");
    document.querySelectorAll("[data-open-cover-letter-regeneration]").forEach((button) => {
      button.addEventListener("click", () => {
        if (!coverLetterRegenerationDialog) return;
        if (typeof coverLetterRegenerationDialog.showModal === "function") {
          coverLetterRegenerationDialog.showModal();
        } else {
          coverLetterRegenerationDialog.setAttribute("open", "");
        }
        coverLetterRegenerationDialog.querySelector("textarea")?.focus();
      });
    });
    document.querySelectorAll("[data-close-cover-letter-regeneration]").forEach((button) => {
      button.addEventListener("click", () => {
        if (!coverLetterRegenerationDialog) return;
        if (typeof coverLetterRegenerationDialog.close === "function") {
          coverLetterRegenerationDialog.close();
        } else {
          coverLetterRegenerationDialog.removeAttribute("open");
        }
      });
    });

    const pollJobAnalysis = async () => {
      const matchElements = new Map(
        Array.from(document.querySelectorAll("[data-job-match]")).map((element) => [element.dataset.jobId, element]),
      );
      if (!Array.from(matchElements.values()).some((element) => ["pending", "running"].includes(element.dataset.matchStatus))) return;
      try {
        const response = await fetch(`/roles/${roleId}/jobs/status`, {headers: {"Accept": "application/json"}});
        if (!response.ok) return;
        const data = await response.json();
        let hasPending = false;
        (data.jobs || []).forEach((job) => {
          const element = matchElements.get(job.id);
          if (!element) return;
          const matchStatus = job.matchStatus || "unavailable";
          const isPending = ["pending", "running"].includes(matchStatus);
          hasPending = hasPending || isPending;
          element.dataset.matchStatus = matchStatus;
          element.title = "";
          element.classList.remove("job-match-score-pending", "job-match-score-failed");
          element.replaceChildren();
          if (job.matchScore !== null && job.matchScore !== undefined) {
            element.append("職缺吻合度 ");
            const score = document.createElement("strong");
            score.textContent = `${job.matchScore}%`;
            element.append(score);
            element.hidden = false;
          } else if (isPending) {
            element.classList.add("job-match-score-pending");
            element.textContent = "職缺吻合度分析中…";
            element.hidden = false;
          } else if (matchStatus === "failed") {
            element.classList.add("job-match-score-failed");
            element.title = job.matchError || "";
            element.textContent = "職缺吻合度分析失敗";
            element.hidden = false;
          } else {
            element.hidden = true;
          }
        });
        if (!hasPending) return;
      } catch (_error) {
        // The next poll retries while the analysis is still pending.
      }
      window.setTimeout(pollJobAnalysis, 2500);
    };

    pollJobAnalysis();

    document.querySelectorAll("[data-loading-form]").forEach((form) => {
      if (form.dataset.backgroundGenerate !== undefined) {
        return;
      }
      form.addEventListener("submit", () => {
        form.classList.add("is-submitting");
        form.querySelectorAll('button[type="submit"]').forEach((button) => {
          if (button.disabled) return;
          button.disabled = true;
          button.setAttribute("aria-busy", "true");
          const loadingLabel = button.dataset.loadingLabel;
          if (loadingLabel) {
            button.setAttribute("aria-label", loadingLabel);
          }
        });
      });
    });
  </script>
