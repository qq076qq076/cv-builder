<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <style>
      @page {
        size: A4;
        margin: 14mm 13mm;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #24313f;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
        font-size: 10.2pt;
        line-height: 1.52;
        background: #ffffff;
      }

      .resume-shell {
        width: 100%;
      }

      .resume-header {
        position: relative;
        overflow: hidden;
        border: 1px solid #dbe7f4;
        border-radius: 10px;
        background: linear-gradient(135deg, #f7fbff 0%, #eef6ff 100%);
        padding: 14px 18px 13px 20px;
        margin-bottom: 16px;
      }

      .resume-header::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 5px;
        background: #2563eb;
      }

      .resume-header h1 {
        margin: 0;
        color: #0f172a;
        font-size: 25pt;
        line-height: 1.1;
      }

      .resume-header p {
        margin: 5px 0 0;
        color: #475569;
        font-size: 10.5pt;
      }

      .resume-content h1 {
        display: none;
      }

      .resume-content h2 {
        margin: 16px 0 8px;
        break-after: avoid;
        border-bottom: 1px solid #d8e4f2;
        color: #1e3a5f;
        font-size: 11.3pt;
        letter-spacing: 0;
        padding-bottom: 3px;
        text-transform: none;
      }

      .resume-content h2::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #2563eb;
        margin-right: 8px;
        vertical-align: 1px;
      }

      .resume-content h2::after {
        content: none;
      }

      .resume-content h3 {
        margin: 11px 0 5px;
        break-after: avoid;
        color: #0f172a;
        font-size: 10.5pt;
      }

      .experience-heading {
        break-after: avoid;
        break-inside: avoid;
        margin: 12px 0 6px;
        border-left: 3px solid #60a5fa;
        border-radius: 6px;
        background: #f8fbff;
        padding: 7px 10px;
      }

      .experience-heading h3 {
        display: inline;
        margin: 0;
      }

      .experience-heading span {
        color: #31506f;
        font-size: 9pt;
        font-weight: 700;
        white-space: nowrap;
        margin-left: 10px;
      }

      .resume-content p {
        margin: 0 0 8px;
      }

      .resume-content ul {
        margin: 5px 0 10px 0;
        padding: 0;
        list-style: none;
      }

      .resume-content li {
        position: relative;
        margin-bottom: 4px;
        padding-left: 15px;
      }

      .resume-content li::before {
        content: "";
        position: absolute;
        left: 1px;
        top: 0.62em;
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: #2563eb;
      }

      .resume-content strong {
        color: #0f172a;
        font-weight: 700;
      }

      .section-gap {
        height: 10px;
      }

      .resume-content code {
        border-radius: 4px;
        background: #eef4fb;
        color: #18324f;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
        font-size: 9.5pt;
        padding: 1px 4px;
      }

      .resume-content h2,
      .resume-content h3,
      .resume-content p,
      .resume-content ul {
        break-inside: avoid;
      }

      .resume-layout-technical .resume-header {
        border-color: #c7ddf5;
        background: linear-gradient(135deg, #f7fbff 0%, #e9f3ff 60%, #f3f8ff 100%);
      }

      .resume-layout-technical .resume-content h2::before,
      .resume-layout-technical .resume-content li::before {
        background: #0f766e;
      }

      .resume-layout-technical .resume-content h2 {
        color: #134e4a;
      }

      .resume-layout-technical .resume-section-featured {
        break-inside: avoid;
        border: 1px solid #cce6e3;
        border-radius: 9px;
        background: #f6fbfa;
        padding: 10px 12px 8px;
        margin: 8px 0 12px;
      }

      .resume-layout-technical .resume-section-featured h2 {
        margin-top: 0;
      }

      .resume-layout-technical .resume-section-featured ul {
        margin-bottom: 0;
      }

      .resume-layout-technical .resume-section-featured li {
        margin-bottom: 2px;
      }

      .resume-layout-standard .resume-section-skills ul {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <main class="resume-shell resume-layout-{{ layout_variant }}">
      <header class="resume-header">
        <div>
          <h1>{{ resume.name or "專用履歷" }}</h1>
          {% if resume.title %}
            <p>{{ resume.title }}</p>
          {% endif %}
        </div>
      </header>
      <article class="resume-content">
        {{ content_html | safe }}
      </article>
    </main>
  </body>
</html>
