<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <style>
      @page {
        size: A4;
        margin: 16mm 14mm;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #1f2933;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
        font-size: 10.5pt;
        line-height: 1.45;
      }

      .resume-shell {
        width: 100%;
      }

      .resume-header {
        border-bottom: 2px solid #2563eb;
        padding-bottom: 10px;
        margin-bottom: 14px;
      }

      .resume-header h1 {
        margin: 0;
        color: #0f172a;
        font-size: 24pt;
        line-height: 1.1;
      }

      .resume-header p {
        margin: 4px 0 0;
        color: #475569;
      }

      .resume-content h1 {
        display: none;
      }

      .resume-content h2 {
        margin: 14px 0 6px;
        break-after: avoid;
        border-bottom: 1px solid #d8dee9;
        color: #1d4ed8;
        font-size: 12pt;
        letter-spacing: 0;
        padding-bottom: 3px;
      }

      .resume-content h3 {
        margin: 10px 0 4px;
        break-after: avoid;
        color: #0f172a;
        font-size: 10.5pt;
      }

      .experience-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: baseline;
        break-after: avoid;
        break-inside: avoid;
        margin: 10px 0 4px;
      }

      .experience-heading h3 {
        margin: 0;
      }

      .experience-heading span {
        color: #475569;
        font-size: 9pt;
        font-weight: 700;
        white-space: nowrap;
      }

      .resume-content p {
        margin: 0 0 7px;
      }

      .resume-content ul {
        margin: 4px 0 8px 18px;
        padding: 0;
      }

      .resume-content li {
        margin-bottom: 3px;
      }

      .resume-content strong {
        color: #0f172a;
        font-weight: 700;
      }

      .section-gap {
        height: 8px;
      }

      .resume-content h2,
      .resume-content h3,
      .resume-content p,
      .resume-content ul {
        break-inside: avoid;
      }
    </style>
  </head>
  <body>
    <main class="resume-shell">
      <header class="resume-header">
        <div>
          <h1>{{ resume.name or "專用履歷" }}</h1>
          {% if resume.title %}
            <p>{{ resume.title }}</p>
          {% endif %}
        </div>
      </header>
      <article class="resume-content">
        {{ content_html | safe }}
      </article>
    </main>
  </body>
</html>
